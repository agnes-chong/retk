<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}retk{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%235b8cff'/%3E%3Cpath d='M7 7h5a3 3 0 0 1 0 6H7zm0 0v10m5-4 4 4' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0f13; --bg-grad: radial-gradient(1200px 600px at 20% -10%, #1a2340 0%, #0d0f13 55%);
    --panel: #151822; --panel-2: #10131a; --border: #262b38; --border-soft: #1d212c;
    --text: #e9ecf1; --muted: #8b93a7; --faint: #5c6478;
    --accent: #6d8bff; --accent-2: #8f6dff; --accent-soft: rgba(109,139,255,0.12);
    --ok: #3ecf8e; --ok-soft: rgba(62,207,142,0.12);
    --warn: #ffb84f; --warn-soft: rgba(255,184,79,0.12);
    --danger: #ff6b7a; --danger-soft: rgba(255,107,122,0.14);
    --radius: 14px; --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --shadow: 0 10px 30px -12px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fb; --bg-grad: radial-gradient(1200px 600px at 20% -10%, #e4e9ff 0%, #f4f6fb 55%);
      --panel: #ffffff; --panel-2: #f7f8fc; --border: #e3e6ef; --border-soft: #edeff5;
      --text: #1a1d27; --muted: #5c6478; --faint: #8b93a7;
      --accent: #4c6fe0; --accent-2: #7a4ce0; --accent-soft: rgba(76,111,224,0.08);
      --ok: #1f9d64; --ok-soft: rgba(31,157,100,0.09);
      --warn: #b4780a; --warn-soft: rgba(180,120,10,0.1);
      --danger: #d6465a; --danger-soft: rgba(214,70,90,0.09);
      --shadow: 0 10px 30px -14px rgba(30,40,80,0.18);
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-grad); background-color: var(--bg); color: var(--text); margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55; min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 90px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--border-soft);
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: white; flex-shrink: 0;
  }
  .brand .name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .brand .tagline { font-size: 12px; color: var(--faint); margin-left: 2px; }
  .badge {
    font-size: 11.5px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);
    color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
  .badge.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px 26px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .panel h3 {
    margin: 0 0 12px; font-size: 14.5px; letter-spacing: 0.02em; text-transform: uppercase;
    color: var(--muted); font-weight: 650;
  }
  .muted { color: var(--muted); font-size: 13.5px; }
  .faint { color: var(--faint); font-size: 12.5px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  pre, code { font-family: var(--mono); }
  pre {
    background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 16px; overflow-x: auto; font-size: 12.5px; max-height: 420px;
  }
  code.inline {
    background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 4px;
    padding: 1px 6px; font-size: 0.92em;
  }
  details {
    border: 1px solid var(--border-soft); border-radius: 10px; overflow: hidden; margin-top: 10px;
  }
  details > summary {
    cursor: pointer; padding: 10px 14px; font-size: 13px; color: var(--text);
    background: var(--panel-2); list-style: none; display: flex; align-items: center; gap: 8px;
    user-select: none;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸"; color: var(--accent); transition: transform 0.15s; font-size: 11px; }
  details[open] > summary::before { transform: rotate(90deg); }
  details > summary:hover { color: var(--accent); }
  details > div, details > pre { margin: 0; border-top: 1px solid var(--border-soft); border-radius: 0; }
  .error-box {
    background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border));
    color: var(--danger); padding: 12px 16px; border-radius: 10px; font-size: 13.5px; margin-bottom: 16px;
  }
  button, input[type=submit], .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border: none;
    border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 550; cursor: pointer;
    transition: opacity 0.15s, transform 0.1s; display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover, input[type=submit]:hover, .btn:hover { opacity: 0.92; }
  button:active, .btn:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.ghost {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
  }
  label { font-size: 13.5px; color: var(--muted); }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 16px; }
  .chip {
    font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px;
    padding: 4px 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px;
  }
  .chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .chip.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
  .divider { height: 1px; background: var(--border-soft); margin: 14px 0; border: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">
      <span class="mark">rk</span>
      <span class="name">retk</span>
      <span class="tagline">reverse engineering toolkit</span>
    </a>
    {% if ai_available %}
      <span class="badge ok"><span class="dot"></span>AI enabled</span>
    {% else %}
      <span class="badge"><span class="dot"></span>AI off</span>
    {% endif %}
  </header>
  {% block body %}{% endblock %}
</div>
</body>
</html>
